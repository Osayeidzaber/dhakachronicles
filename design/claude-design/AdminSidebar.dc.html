<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>CMS sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#030303}
a{color:#fff;text-decoration:none}a:hover{color:#fff}
</style>
</helmet>
<aside style="width: 248px; min-height: 1000px; box-sizing: border-box; background: #030303; border-right: 1px solid rgba(255,255,255,0.06); color: #fff; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 12px">
<a href="Dashboard.dc.html" style="display: flex; flex-direction: column; gap: 2px; padding: 4px 12px 24px">
<span style="font-family: 'Instrument Serif', Georgia, serif; font-size: 26px; line-height: 1">Dhaka Chronicles</span>
<span style="font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #8a8a8a">Newsroom</span>
</a>
<a href="Editor.dc.html" style="margin: 0 4px 16px; height: 40px; border-radius: 999px; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500">+ New article</a>
<nav aria-label="Admin" style="display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{items}}" as="n" hint-placeholder-count="11">
<a href="{{n.href}}" aria-current="{{n.current}}" style="{{n.style}}">
<span style="width: 6px; height: 6px; border-radius: 999px; background: {{n.dot}}" aria-hidden="true"></span>
<span style="flex: 1">{{n.label}}</span>
<sc-if value="{{n.badge}}" hint-placeholder-val="{{false}}"><span style="font-size: 11px; padding: 1px 8px; border-radius: 999px; background: #1f1f1f; color: #c4c4c4">{{n.badge}}</span></sc-if>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; align-items: center; gap: 10px; padding: 12px; border-top: 1px solid rgba(255,255,255,0.06)">
<span style="width: 36px; height: 36px; border-radius: 999px; background: #1f1f1f; display: grid; place-items: center; font-size: 13px" aria-hidden="true">[A]</span>
<span style="flex: 1; display: flex; flex-direction: column; min-width: 0"><span style="font-size: 13px">[Your name]</span><span style="font-size: 12px; color: #8a8a8a">Admin</span></span>
<a href="Login.dc.html" style="font-size: 12px; color: #8a8a8a">Sign out</a>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","articles","instagram","media","sections","tags","authors","brand","team","profile","settings"],"default":"overview"},"$preview":{"width":248,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const act = this.props.active ?? 'overview';
const list = [
['overview', 'Overview', 'Dashboard.dc.html'], ['articles', 'Articles', 'Articles.dc.html', '[n]'], ['instagram', 'Instagram', 'Instagram.dc.html'],
['media', 'Media', 'Media.dc.html'], ['sections', 'Sections', 'Categories.dc.html'], ['tags', 'Tags', 'Tags.dc.html'],
['authors', 'Authors', 'Authors.dc.html'], ['brand', 'Brand deals', 'BrandDeals.dc.html'], ['team', 'Team', 'Team.dc.html'],
['profile', 'Profile', 'Profile.dc.html'], ['settings', 'Settings', 'Settings.dc.html']
];
return { items: list.map(([k, label, href, badge]) => {
const on = k === act;
return { label, href, badge: badge || false, current: on ? 'page' : 'false', dot: on ? '#fff' : '#3a3a3a',
style: 'display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px; ' + (on ? 'background: #141414; color: #fff' : 'color: #a3a3a3') };
}) };
}
}
</script>
</body>
</html>
