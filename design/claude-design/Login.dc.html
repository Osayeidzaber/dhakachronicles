<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Staff sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&amp;family=Inter:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#c4c4c4}a:hover{color:#fff}
</style>
</helmet>
<div style="min-height: 900px; background: #000; color: #fff; font-family: Inter, system-ui, sans-serif; display: flex; flex-wrap: wrap">
<section style="flex: 1 1 480px; display: flex; flex-direction: column; justify-content: space-between; padding: 48px; border-right: 1px solid rgba(255,255,255,0.08); box-sizing: border-box">
<a href="Main.dc.html" style="color: #fff; text-decoration: none; font-family: 'Instrument Serif', Georgia, serif; font-size: 32px">Dhaka Chronicles</a>
<div style="display: flex; flex-direction: column; gap: 16px; max-width: 520px">
<span style="font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #8a8a8a">Newsroom</span>
<p style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-size: 56px; line-height: 1.02">Delivering timely, accurate, and engaging news.</p>
</div>
<span style="font-size: 13px; color: #8a8a8a">Staff accounts are created by administrators.</span>
</section>
<section style="flex: 1 1 480px; display: flex; align-items: center; justify-content: center; padding: 48px; box-sizing: border-box">
<form style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 18px">
<h1 style="margin: 0 0 8px; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 44px">Sign in</h1>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #c4c4c4">Email
<input type="email" placeholder="you@example.com" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: #0a0a0a; color: #fff; font: inherit; font-size: 14px">
</label>
<label style="display: flex; flex-direction: column; gap: 8px; font-size: 13px; color: #c4c4c4">Password
<input type="password" style="height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.14); background: #0a0a0a; color: #fff; font: inherit; font-size: 14px">
</label>
<p role="alert" style="margin: 0; padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(239,68,68,0.4); color: #fca5a5; font-size: 13px">Wrong email or password. (Shown only on error.)</p>
<a href="Dashboard.dc.html" style="height: 44px; border-radius: 999px; background: #fff; color: #000; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; text-decoration: none">Sign in</a>
<a href="Main.dc.html" style="font-size: 13px; text-align: center">← Back to the site</a>
</form>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

</script>
</body>
</html>
