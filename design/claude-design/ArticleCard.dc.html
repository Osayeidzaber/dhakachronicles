<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ArticleCard</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Inter:wght@400;500;600&amp;family=Hind+Siliguri:wght@400;600&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff;text-decoration:none}a:hover{color:#c4c4c4}
</style>
</helmet>
<article style="color: #fff; font-family: Inter, 'Hind Siliguri', system-ui, sans-serif; background: #000">
<sc-if value="{{isLead}}" hint-placeholder-val="{{false}}">
<a href="Article.dc.html" style="display: flex; flex-direction: column; gap: 20px">
<div style="aspect-ratio: 16 / 10; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); background: linear-gradient(135deg, #161616, #000)"></div>
<p style="margin: 0; display: flex; gap: 8px; align-items: center; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #8a8a8a"><sc-if value="{{a.breaking}}" hint-placeholder-val="{{false}}"><span style="background: #fff; color: #000; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 2px">Breaking</span></sc-if><span>{{a.cat}} · {{a.date}}</span></p>
<h2 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 60px; line-height: 1.02">{{a.title}}</h2>
<p style="margin: 0; max-width: 672px; font-size: 18px; line-height: 1.6; color: #a3a3a3">{{a.dek}}</p>
<p style="margin: 0; font-size: 13px; color: #8a8a8a">{{a.author}}</p>
</a>
</sc-if>
<sc-if value="{{isCard}}" hint-placeholder-val="{{true}}">
<a href="Article.dc.html" style="display: flex; flex-direction: column; gap: 12px">
<div style="aspect-ratio: 3 / 2; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); background: linear-gradient(135deg, #161616, #000)"></div>
<p style="margin: 0; display: flex; gap: 8px; align-items: center; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #8a8a8a"><sc-if value="{{a.breaking}}" hint-placeholder-val="{{false}}"><span style="background: #fff; color: #000; font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 2px">Breaking</span></sc-if><span>{{a.cat}} · {{a.date}}</span></p>
<h3 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 26px; line-height: 1.12">{{a.title}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #a3a3a3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{a.dek}}</p>
</a>
</sc-if>
<sc-if value="{{isRow}}" hint-placeholder-val="{{false}}">
<a href="Article.dc.html" style="display: flex; flex-wrap: wrap; gap: 24px; align-items: center; padding: 28px 0; border-bottom: 1px solid rgba(255,255,255,0.08)">
<div style="flex: 999 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px">
<p style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #8a8a8a">{{a.cat}} · {{a.date}}</p>
<h3 style="margin: 0; font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.08">{{a.title}}</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #a3a3a3">{{a.dek}}</p>
</div>
<div style="flex: 0 0 260px; aspect-ratio: 3 / 2; border-radius: 16px; border: 1px solid rgba(255,255,255,0.06); background: linear-gradient(135deg, #161616, #000)"></div>
</a>
</sc-if>
<sc-if value="{{isCompact}}" hint-placeholder-val="{{false}}">
<a href="Article.dc.html" style="display: grid; grid-template-columns: 84px 1fr; gap: 16px">
<div style="aspect-ratio: 1 / 1; border-radius: 12px; border: 1px solid rgba(255,255,255,0.06); background: linear-gradient(135deg, #161616, #000)"></div>
<div style="display: flex; flex-direction: column; gap: 6px">
<p style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #8a8a8a">{{a.cat}} · {{a.date}}</p>
<h3 style="margin: 0; font-size: 15px; line-height: 1.4; font-weight: 500">{{a.title}}</h3>
</div>
</a>
</sc-if>
<sc-if value="{{isText}}" hint-placeholder-val="{{false}}">
<a href="Article.dc.html" style="display: block; padding: 14px 0; border-top: 1px solid rgba(255,255,255,0.06)">
<p style="margin: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: #8a8a8a">{{a.date}}</p>
<h3 style="margin: 4px 0 0; font-size: 16px; line-height: 1.4; font-weight: 500">{{a.title}}</h3>
</a>
</sc-if>
</article>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"variant":{"editor":"enum","options":["lead","card","row","compact","text"],"default":"card"},"a":{"editor":null},"$preview":{"width":400,"height":480}}'>
class Component extends DCLogic {
renderVals() {
const v = this.props.variant ?? 'card';
const a = this.props.a ?? { cat: 'World', date: '13 Nov', title: 'FAA halts all departing US flights after communications outage', dek: 'More than 10,000 delays and around 4,000 cancellations were reported.', author: 'Dhaka Chronicles', breaking: true };
return { a, isLead: v === 'lead', isCard: v === 'card', isRow: v === 'row', isCompact: v === 'compact', isText: v === 'text' };
}
}
</script>
</body>
</html>
