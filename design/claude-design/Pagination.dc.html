<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pagination</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Hind+Siliguri:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#fff;text-decoration:none}a:hover{color:#fff}
</style>
</helmet>
<nav aria-label="Pagination" style="background: #000; color: #fff; font-family: Inter, 'Hind Siliguri', sans-serif; font-size: 14px; display: flex; align-items: center; justify-content: space-between; padding: 24px 0">
<a href="#" rel="prev" style="height: 40px; padding: 0 16px; display: inline-flex; align-items: center; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; font-weight: 500">← {{prev}}</a>
<span style="color: #8a8a8a">{{page}} / {{total}}</span>
<a href="#" rel="next" style="height: 40px; padding: 0 16px; display: inline-flex; align-items: center; border: 1px solid rgba(255,255,255,0.14); border-radius: 999px; font-weight: 500">{{next}} →</a>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"lang":{"editor":"enum","options":["en","bn"],"default":"en"},"page":{"editor":"int","default":1},"total":{"editor":"int","default":3},"$preview":{"width":800,"height":120}}'>
class Component extends DCLogic {
renderVals() {
const bn = (this.props.lang ?? 'en') === 'bn';
return { page: this.props.page ?? 1, total: this.props.total ?? 3, prev: bn ? 'আগের' : 'Previous', next: bn ? 'পরের' : 'Next' };
}
}
</script>
</body>
</html>
