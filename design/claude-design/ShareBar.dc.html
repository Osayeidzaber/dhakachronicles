<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShareBar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#000}
a{color:#8a8a8a;text-decoration:none}a:hover{color:#fff}
</style>
</helmet>
<div style="background: #000; color: #fff; font-family: Inter, sans-serif; display: flex; flex-direction: column; gap: 12px; padding: 8px 0">
<div style="display: flex; gap: 8px">
<button type="button" aria-label="{{copyLabel}}" onClick="{{copy}}" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer">
<sc-if value="{{copied}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg></sc-if>
<sc-if value="{{notCopied}}" hint-placeholder-val="{{true}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 17H7A5 5 0 0 1 7 7h2M15 7h2a5 5 0 0 1 0 10h-2M8 12h8"></path></svg></sc-if>
</button>
<button type="button" aria-label="Share" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #fff; display: grid; place-items: center; cursor: pointer">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"></path></svg>
</button>
</div>
<p style="margin: 0; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px"><a href="#">WhatsApp</a><a href="#">Facebook</a><a href="#">X</a><a href="#">LinkedIn</a></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":140}}'>
class Component extends DCLogic {
renderVals() {
const copied = !!(this.state && this.state.copied);
return { copied, notCopied: !copied, copyLabel: copied ? 'Copied' : 'Copy link', copy: () => { this.setState({ copied: true }); setTimeout(() => this.setState({ copied: false }), 1800); } };
}
}
</script>
</body>
</html>
